# Builds the Docker image (Dockerfile) and publishes it as ghcr.io/barry2040/the-drawer-dividers
# for x86 and ARM (Raspberry Pi, most NAS). Pull requests only build it.
name: Docker-Image

on:
  push:
    branches: [main]
    paths: ["Drawer-Divider-Designer.html", "pwa/**", "fonts/**", "Dockerfile", ".dockerignore", ".github/workflows/docker.yml"]
  pull_request:
    paths: ["Drawer-Divider-Designer.html", "pwa/**", "fonts/**", "Dockerfile", ".dockerignore", ".github/workflows/docker.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/barry2040/the-drawer-dividers:latest
            ghcr.io/barry2040/the-drawer-dividers:${{ github.sha }}
