# Publishes the self-contained designer (Drawer-Divider-Designer.html) to GitHub Pages.
name: Designer auf GitHub Pages

on:
  push:
    branches: [main]
    paths: ["Drawer-Divider-Designer.html", "pwa/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # the page plus what makes it an installable app (manifest, offline cache, icons)
      - run: mkdir _site && cp Drawer-Divider-Designer.html _site/index.html && cp pwa/* _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
